name: ur12e-collection
services:
  dev:
    profiles: [dev]
    image: ${UR12E_IMAGE:-ur12e-collection:current}
    platform: linux/amd64
    build:
      context: .
      target: development
    network_mode: none
    user: "${UR12E_UID:-10001}:${UR12E_GID:-10001}"
    volumes:
      - type: bind
        source: ${UR12E_CONFIG_DIR:-./config/local}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${UR12E_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
  station:
    profiles: [station]
    image: ${UR12E_IMAGE:-ur12e-collection:current}
    platform: linux/amd64
    build:
      context: .
      target: development
    network_mode: host
    user: "${UR12E_UID:-10001}:${UR12E_GID:-10001}"
    volumes:
      - type: bind
        source: ${UR12E_CONFIG_DIR:-/var/lib/ur12e-collection}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${UR12E_DATA_DIR:-/var/lib/ur12e-collection/data}
        target: /data
        bind:
          create_host_path: false
